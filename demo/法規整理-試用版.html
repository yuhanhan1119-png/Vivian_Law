<style>
/* 法規整理 App 樣式：手機優先，桌機自動加寬 */

:root {
  --ink: #16202c;
  --ink-soft: #55637a;
  --ink-faint: #8b98ab;
  --paper: #f5f6f8;
  --card: #ffffff;
  --line: #e2e6ec;
  --brand: #1f3a5f;
  --brand-soft: #e8eef7;
  --accent: #9a6b2f;
  --danger: #b3261e;
  --ok: #1f6b45;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(22, 32, 44, .06), 0 8px 24px rgba(22, 32, 44, .06);
  --tabbar-height: 58px;
  --reading-size: 17px;
  --reading-line: 1.9;
  color-scheme: light dark;
}

[data-theme="dark"] {
  --ink: #e7ecf3;
  --ink-soft: #a8b4c6;
  --ink-faint: #7c8798;
  --paper: #12161c;
  --card: #1a2027;
  --line: #2a323d;
  --brand: #8fb4e8;
  --brand-soft: #1e2936;
  --accent: #d5a869;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}

body { padding-bottom: calc(var(--tabbar-height) + env(safe-area-inset-bottom)); }

a { color: var(--brand); text-decoration: none; }
button { font: inherit; cursor: pointer; }

/* ------------------------------------------------------------ 頂部列 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top) + 12px) 14px 12px;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: saturate(150%) blur(12px);
  border-bottom: 1px solid var(--line);
}

.topbar__titles { flex: 1; min-width: 0; }
.topbar__title {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar__subtitle {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--ink-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar__back {
  border: none;
  background: var(--brand-soft);
  color: var(--brand);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 22px;
  line-height: 1;
  padding: 0 0 3px;
}
.topbar__actions { display: flex; align-items: center; gap: 8px; }
.icon-button {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 15px;
}

.badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand);
  white-space: nowrap;
}
.badge--offline { background: #fdf1d6; color: #8a5a00; }
[data-theme="dark"] .badge--offline { background: #3a2f18; color: #e6bd6a; }

/* ------------------------------------------------------------ 版面 */
.view { padding: 14px 14px 24px; max-width: 860px; margin: 0 auto; }
.view:focus { outline: none; }
.loading, .empty {
  padding: 40px 16px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 14px;
}

.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin: 22px 2px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: .6px;
}
.section-title:first-child { margin-top: 4px; }
.section-title a { font-size: 12px; font-weight: 500; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 12px;
}
.card--tap { display: block; color: inherit; transition: transform .12s ease; }
.card--tap:active { transform: scale(.99); }

.list { display: flex; flex-direction: column; gap: 10px; }

.law-card__name { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
.law-card__meta { font-size: 12px; color: var(--ink-faint); display: flex; flex-wrap: wrap; gap: 8px; }
.law-card__chips { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

.chip {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand);
  border: none;
}
.chip--muted { background: transparent; color: var(--ink-faint); border: 1px solid var(--line); }
.chip--accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.chip--del { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

/* ------------------------------------------------------------ 檢索 */
.searchbar { display: flex; gap: 8px; margin-bottom: 12px; }
.searchbar input {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  font-size: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
}
.searchbar input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }

.button {
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 600;
  background: var(--brand);
  color: #fff;
}
.button--ghost { background: var(--card); color: var(--brand); border: 1px solid var(--line); }
.button--block { display: block; width: 100%; }
.button--small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.button:disabled { opacity: .5; }

.button-row { display: flex; gap: 8px; flex-wrap: wrap; }

.hit__head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.hit__law { font-size: 13px; color: var(--ink-soft); }
.hit__version { font-size: 11px; color: var(--ink-faint); }
.hit__label { font-size: 15px; font-weight: 700; }
.hit__path { font-size: 11px; color: var(--ink-faint); margin: 4px 0 0; }
.hit__snippet { font-size: 14px; line-height: 1.7; margin: 8px 0 0; color: var(--ink-soft); }
mark { background: color-mix(in srgb, var(--accent) 28%, transparent); color: inherit; padding: 0 2px; border-radius: 3px; }

/* ------------------------------------------------------------ 章節樹 */
.tree { display: flex; flex-direction: column; gap: 2px; }
.tree__division {
  font-weight: 700;
  color: var(--brand);
  padding: 10px 0 4px;
  font-size: 14px;
}
.tree__division[data-level="2"] { font-size: 13.5px; }
.tree__division[data-level="3"] { font-size: 13px; color: var(--ink-soft); }
.tree__article {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  color: inherit;
  align-items: baseline;
}
.tree__article:active { background: var(--brand-soft); }
.tree__label { font-weight: 700; font-size: 14px; white-space: nowrap; }
.tree__preview {
  font-size: 13px;
  color: var(--ink-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tree__group { padding-left: 10px; border-left: 2px solid var(--line); margin-left: 4px; display: flex; flex-direction: column; gap: 6px; }

/* ------------------------------------------------------------ 條文 */
.article__label { font-size: 20px; font-weight: 700; margin: 0; }
.article__path { font-size: 12px; color: var(--ink-faint); margin: 6px 0 0; }
.article__body {
  font-size: var(--reading-size);
  line-height: var(--reading-line);
  margin-top: 14px;
  font-family: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
}
.paragraph { margin: 0 0 12px; text-indent: 2em; }
.paragraph__index {
  display: inline-block;
  text-indent: 0;
  margin-right: 6px;
  font-size: 12px;
  color: var(--ink-faint);
  font-family: system-ui, sans-serif;
  vertical-align: 2px;
}
.items { margin: 6px 0 12px; padding-left: 2em; display: flex; flex-direction: column; gap: 6px; }
.item { text-indent: 0; }
.item--目 { padding-left: 1.6em; color: var(--ink-soft); font-size: .95em; }
.ref-link {
  border-bottom: 1px dashed var(--brand);
  cursor: pointer;
  color: var(--brand);
}

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

.reference { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.reference:last-child { border-bottom: none; }
.reference__relation {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--brand-soft);
  color: var(--brand);
  white-space: nowrap;
}
.reference__relation[data-relation="準用"] { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.reference__relation[data-relation="除外"] { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.reference__text { flex: 1; min-width: 0; }
.reference__context { font-size: 12px; color: var(--ink-faint); margin-top: 3px; }

textarea, select, input[type="text"] {
  width: 100%;
  padding: 11px 12px;
  font-size: 15px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font-family: inherit;
}
textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
label.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--ink-soft); }
label.field > span { display: block; margin-bottom: 6px; font-weight: 600; }

.tag-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand);
}
.tag-pill button { border: none; background: none; color: inherit; font-size: 14px; line-height: 1; padding: 0; }

/* ------------------------------------------------------------ 比對 */
.diff-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.diff-change { margin-bottom: 12px; }
.diff-change__head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.diff-body { font-size: 15px; line-height: 1.9; }
.diff-ins { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); border-radius: 3px; }
.diff-del { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); text-decoration: line-through; border-radius: 3px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; text-align: center; }
.stat__value { font-size: 20px; font-weight: 700; }
.stat__label { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

.path-table { width: 100%; font-size: 12.5px; border-collapse: collapse; }
.path-table th { text-align: left; color: var(--ink-soft); font-weight: 600; padding: 6px 8px 6px 0; white-space: nowrap; vertical-align: top; }
.path-table td { padding: 6px 0; color: var(--ink-soft); word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

/* ------------------------------------------------------------ 底部導覽 */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  display: flex;
  height: calc(var(--tabbar-height) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(150%) blur(12px);
  border-top: 1px solid var(--line);
}
.tabbar__item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10.5px;
  color: var(--ink-faint);
  padding-top: 4px;
}
.tabbar__item[aria-current="page"] { color: var(--brand); font-weight: 700; }
.tabbar__icon { font-size: 19px; line-height: 1; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-height) + env(safe-area-inset-bottom) + 16px);
  transform: translateX(-50%);
  z-index: 40;
  background: var(--ink);
  color: var(--paper);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  box-shadow: var(--shadow);
  max-width: 88vw;
  text-align: center;
}

@media (min-width: 760px) {
  body { padding-bottom: 0; padding-top: 0; }
  .tabbar { position: sticky; top: 0; bottom: auto; order: -1; height: 54px; padding-bottom: 0; }
  .tabbar__item { flex-direction: row; gap: 6px; font-size: 13px; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  .view { padding-top: 20px; }
}

@media print {
  .topbar, .tabbar, .toolbar, .toast { display: none !important; }
  .view { max-width: none; }
}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="topbar__back" id="back-button" hidden aria-label="返回">‹</button>
    <div class="topbar__titles">
      <h1 class="topbar__title" id="page-title">法規整理</h1>
      <p class="topbar__subtitle" id="page-subtitle">整理你的法規知識庫</p>
    </div>
    <div class="topbar__actions">
      <span class="badge badge--offline" id="offline-badge" hidden>離線</span>
      <button class="icon-button" id="theme-button" aria-label="切換深淺色">◐</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <div class="loading">載入中…</div>

共秩序或善良風俗者為限。","paragraphs":[{"index":1,"text":"民事所適用之習慣，以不背於公共秩序或善良風俗者為限。","items":[]}],"tags":[],"note":"","refs":[]},{"id":3,"number":3,"sub":0,"label":"第 3 條","label_chinese":"第三條","division_seq":1,"division_path":"第一編 總則 > 第一章 法例","is_deleted":false,"text":"依法律規定，有使用文字之必要者，得不由本人自寫，但必須親自簽名。\n如有用印章代簽名者，其蓋章與簽名生同等之效力。\n如以指印、十字或其他符號代簽名者，在文件上，經二人簽名證明，亦與簽名生同等之效力。","paragraphs":[{"index":1,"text":"依法律規定，有使用文字之必要者，得不由本人自寫，但必須親自簽名。","items":[]},{"index":2,"text":"如有用印章代簽名者，其蓋章與簽名生同等之效力。","items":[]},{"index":3,"text":"如以指印、十字或其他符號代簽名者，在文件上，經二人簽名證明，亦與簽名生同等之效力。","items":[]}],"tags":[],"note":"","refs":[]},{"id":4,"number":6,"sub":0,"label":"第 6 條","label_chinese":"第六條","division_seq":3,"division_path":"第一編 總則 > 第二章 人 > 第一節 自然人","is_deleted":false,"text":"人之權利能力，始於出生，終於死亡。","paragraphs":[{"index":1,"text":"人之權利能力，始於出生，終於死亡。","items":[]}],"tags":[],"note":"","refs":[]},{"id":5,"number":12,"sub":0,"label":"第 12 條","label_chinese":"第十二條","division_seq":3,"division_path":"第一編 總則 > 第二章 人 > 第一節 自然人","is_deleted":false,"text":"滿十八歲為成年。","paragraphs":[{"index":1,"text":"滿十八歲為成年。","items":[]}],"tags":[],"note":"","refs":[]},{"id":6,"number":13,"sub":0,"label":"第 13 條","label_chinese":"第十三條","division_seq":3,"division_path":"第一編 總則 > 第二章 人 > 第一節 自然人","is_deleted":false,"text":"未滿七歲之未成年人，無行為能力。\n滿七歲以上之未成年人，有限制行為能力。","paragraphs":[{"index":1,"text":"未滿七歲之未成年人，無行為能力。","items":[]},{"index":2,"text":"滿七歲以上之未成年人，有限制行為能力。","items":[]}],"tags":[],"note":"","refs":[]},{"id":7,"number":71,"sub":0,"label":"第 71 條","label_chinese":"第七十一條","division_seq":5,"division_path":"第一編 總則 > 第四章 法律行為 > 第一節 通則","is_deleted":false,"text":"法律行為，違反強制或禁止之規定者，無效。但其規定並不以之為無效者，不在此限。","paragraphs":[{"index":1,"text":"法律行為，違反強制或禁止之規定者，無效。但其規定並不以之為無效者，不在此限。","items":[]}],"tags":[],"note":"","refs":[]},{"id":8,"number":72,"sub":0,"label":"第 72 條","label_chinese":"第七十二條","division_seq":5,"division_path":"第一編 總則 > 第四章 法律行為 > 第一節 通則","is_deleted":false,"text":"法律行為，有背於公共秩序或善良風俗者，無效。","paragraphs":[{"index":1,"text":"法律行為，有背於公共秩序或善良風俗者，無效。","items":[]}],"tags":[],"note":"","refs":[]},{"id":9,"number":148,"sub":0,"label":"第 148 條","label_chinese":"第一百四十八條","division_seq":6,"division_path":"第一編 總則 > 第七章 權利之行使","is_deleted":false,"text":"權利之行使，不得違反公共利益，或以損害他人為主要目的。\n行使權利，履行義務，應依誠實及信用方法。","paragraphs":[{"index":1,"text":"權利之行使，不得違反公共利益，或以損害他人為主要目的。","items":[]},{"index":2,"text":"行使權利，履行義務，應依誠實及信用方法。","items":[]}],"tags":[],"note":"","refs":[]},{"id":10,"number":184,"sub":0,"label":"第 184 條","label_chinese":"第一百八十四條","division_seq":10,"division_path":"第二編 債 > 第一章 通則 > 第一節 債之發生 > 第五款 侵權行為","is_deleted":false,"text":"因故意或過失，不法侵害他人之權利者，負損害賠償責任。故意以背於善良風俗之方法，加損害於他人者亦同。\n違反保護他人之法律，致生損害於他人者，負賠償責任。但能證明其行為無過失者，不在此限。","paragraphs":[{"index":1,"text":"因故意或過失，不法侵害他人之權利者，負損害賠償責任。故意以背於善良風俗之方法，加損害於他人者亦同。","items":[]},{"index":2,"text":"違反保護他人之法律，致生損害於他人者，負賠償責任。但能證明其行為無過失者，不在此限。","items":[]}],"tags":[],"note":"","refs":[]}],"stats":{"articles":10,"deleted":0,"divisions":11,"references":0,"average_length":40.9,"longest":{"label":"第 3 條","length":98}}},{"id":3,"name":"示範資料保護法","short_name":"","category":"示範用（虛構法規，僅供測試解析與比對功能）","authority":"","version_label":"民國 108 年 05 月 10 日","amended":"","promulgated":"民國 108 年 05 月 10 日","divisions":[{"id":16,"law_id":3,"seq":0,"parent_seq":null,"kind":"章","number":1,"sub":0,"title":"總則","level":2,"heading":"第一章 總則"},{"id":17,"law_id":3,"seq":1,"parent_seq":null,"kind":"章","number":3,"sub":0,"title":"當事人權利","level":2,"heading":"第三章 當事人權利"},{"id":18,"law_id":3,"seq":2,"parent_seq":null,"kind":"章","number":4,"sub":0,"title":"損害賠償及罰則","level":2,"heading":"第四章 損害賠償及罰則"},{"id":19,"law_id":3,"seq":3,"parent_seq":null,"kind":"章","number":5,"sub":0,"title":"附則","level":2,"heading":"第五章 附則"}],"articles":[{"id":28,"number":1,"sub":0,"label":"第 1 條","label_chinese":"第一條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"為規範個人資料之蒐集、處理及利用，保障人格權益，特制定本法。","paragraphs":[{"index":1,"text":"為規範個人資料之蒐集、處理及利用，保障人格權益，特制定本法。","items":[]}],"tags":[],"note":"","refs":[]},{"id":29,"number":2,"sub":0,"label":"第 2 條","label_chinese":"第二條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"本法用詞，定義如下：\n一、個人資料：指自然人之姓名、出生年月日、聯絡方式及其他得以直接或間接識別該個人之資料。\n二、蒐集：指以任何方式取得個人資料。\n三、處理：指為建立或利用個人資料檔案所為之紀錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送。\n四、當事人：指個人資料之本人。","paragraphs":[{"index":1,"text":"本法用詞，定義如下：","items":[{"kind":"款","label":"一、","text":"個人資料：指自然人之姓名、出生年月日、聯絡方式及其他得以直接或間接識別該個人之資料。","children":[]},{"kind":"款","label":"二、","text":"蒐集：指以任何方式取得個人資料。","children":[]},{"kind":"款","label":"三、","text":"處理：指為建立或利用個人資料檔案所為之紀錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送。","children":[]},{"kind":"款","label":"四、","text":"當事人：指個人資料之本人。","children":[]}]}],"tags":[],"note":"","refs":[]},{"id":30,"number":3,"sub":0,"label":"第 3 條","label_chinese":"第三條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"本法之主管機關如下：\n一、在中央：為數位發展主管機關。\n二、在地方：\n（一）直轄市：為直轄市政府。\n（二）縣（市）：為縣（市）政府。\n第 二 章 蒐集、處理及利用","paragraphs":[{"index":1,"text":"本法之主管機關如下：","items":[{"kind":"款","label":"一、","text":"在中央：為數位發展主管機關。","children":[]},{"kind":"款","label":"二、","text":"在地方：","children":[{"kind":"目","label":"（一）","text":"直轄市：為直轄市政府。","children":[]},{"kind":"目","label":"（二）","text":"縣（市）：為縣（市）政府。","children":[]}]}]},{"index":2,"text":"第 二 章 蒐集、處理及利用","items":[]}],"tags":[],"note":"","refs":[]},{"id":31,"number":5,"sub":0,"label":"第 5 條","label_chinese":"第五條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍。","paragraphs":[{"index":1,"text":"個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍。","items":[]}],"tags":[],"note":"","refs":[]},{"id":32,"number":6,"sub":0,"label":"第 6 條","label_chinese":"第六條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"蒐集個人資料，應向當事人告知下列事項：\n一、蒐集之目的。\n二、個人資料之類別。\n三、利用之期間、地區、對象及方式。\n四、當事人得行使之權利及方式。","paragraphs":[{"index":1,"text":"蒐集個人資料，應向當事人告知下列事項：","items":[{"kind":"款","label":"一、","text":"蒐集之目的。","children":[]},{"kind":"款","label":"二、","text":"個人資料之類別。","children":[]},{"kind":"款","label":"三、","text":"利用之期間、地區、對象及方式。","children":[]},{"kind":"款","label":"四、","text":"當事人得行使之權利及方式。","children":[]}]}],"tags":[],"note":"","refs":[]},{"id":33,"number":7,"sub":0,"label":"第 7 條","label_chinese":"第七條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"有下列情形之一者，得免為前條之告知：\n一、依法律規定得免告知。\n二、為免除當事人之生命、身體、自由或財產上之危險。\n三、告知將妨害公務機關執行法定職務。","paragraphs":[{"index":1,"text":"有下列情形之一者，得免為前條之告知：","items":[{"kind":"款","label":"一、","text":"依法律規定得免告知。","children":[]},{"kind":"款","label":"二、","text":"為免除當事人之生命、身體、自由或財產上之危險。","children":[]},{"kind":"款","label":"三、","text":"告知將妨害公務機關執行法定職務。","children":[]}]}],"tags":[],"note":"","refs":[]},{"id":34,"number":8,"sub":0,"label":"第 8 條","label_chinese":"第八條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"公務機關保有個人資料檔案者，應指定專人辦理安全維護事項，防止個人資料被竊取、竄改、毀損、滅失或洩漏。\n非公務機關準用前項規定。","paragraphs":[{"index":1,"text":"公務機關保有個人資料檔案者，應指定專人辦理安全維護事項，防止個人資料被竊取、竄改、毀損、滅失或洩漏。","items":[]},{"index":2,"text":"非公務機關準用前項規定。","items":[]}],"tags":[],"note":"","refs":[]},{"id":35,"number":9,"sub":0,"label":"第 9 條","label_chinese":"第九條","division_seq":0,"division_path":"第一章 總則","is_deleted":true,"text":"（刪除）","paragraphs":[],"tags":[],"note":"","refs":[]},{"id":36,"number":10,"sub":0,"label":"第 10 條","label_chinese":"第十條","division_seq":1,"division_path":"第三章 當事人權利","is_deleted":false,"text":"當事人就其個人資料得行使下列權利：\n一、查詢或請求閱覽。\n二、請求製給複製本。\n三、請求補充或更正。\n四、請求停止蒐集、處理或利用。\n五、請求刪除。\n前項權利，不得預先拋棄或以特約限制之。","paragraphs":[{"index":1,"text":"當事人就其個人資料得行使下列權利：","items":[{"kind":"款","label":"一、","text":"查詢或請求閱覽。","children":[]},{"kind":"款","label":"二、","text":"請求製給複製本。","children":[]},{"kind":"款","label":"三、","text":"請求補充或更正。","children":[]},{"kind":"款","label":"四、","text":"請求停止蒐集、處理或利用。","children":[]},{"kind":"款","label":"五、","text":"請求刪除。","children":[]}]},{"index":2,"text":"前項權利，不得預先拋棄或以特約限制之。","items":[]}],"tags":[],"note":"","refs":[]},{"id":37,"number":11,"sub":0,"label":"第 11 條","label_chinese":"第十一條","division_seq":1,"division_path":"第三章 當事人權利","is_deleted":false,"text":"非公務機關受理當事人依第十條所為之請求，應於十五日內為准駁之決定；必要時得予延長，延長之期間不得逾十五日。","paragraphs":[{"index":1,"text":"非公務機關受理當事人依第十條所為之請求，應於十五日內為准駁之決定；必要時得予延長，延長之期間不得逾十五日。","items":[]}],"tags":[],"note":"","refs":[{"relation":"依據","target_law":null,"target_article":10,"target_sub":0,"target_paragraph":null,"raw_text":"第十條","to_article_id":36}]},{"id":38,"number":15,"sub":0,"label":"第 15 條","label_chinese":"第十五條","division_seq":2,"division_path":"第四章 損害賠償及罰則","is_deleted":false,"text":"違反本法規定，致當事人受損害者，應負損害賠償責任。但能證明其無故意或過失者，不在此限。\n損害賠償之請求，適用民法第一百九十七條之規定。","paragraphs":[{"index":1,"text":"違反本法規定，致當事人受損害者，應負損害賠償責任。但能證明其無故意或過失者，不在此限。","items":[]},{"index":2,"text":"損害賠償之請求，適用民法第一百九十七條之規定。","items":[]}],"tags":[],"note":"","refs":[{"relation":"適用","target_law":"民法","target_article":197,"target_sub":0,"target_paragraph":null,"raw_text":"適用民法第一百九十七條","to_article_id":null}]},{"id":39,"number":16,"sub":0,"label":"第 16 條","label_chinese":"第十六條","division_seq":2,"division_path":"第四章 損害賠償及罰則","is_deleted":false,"text":"違反第五條至第八條規定者，由主管機關處新臺幣二萬元以上二十萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。","paragraphs":[{"index":1,"text":"違反第五條至第八條規定者，由主管機關處新臺幣二萬元以上二十萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。","items":[]}],"tags":[],"note":"","refs":[{"relation":"處罰","target_law":null,"target_article":5,"target_sub":0,"target_paragraph":null,"raw_text":"第五條至第八條","to_article_id":31},{"relation":"處罰","target_law":null,"target_article":6,"target_sub":0,"target_paragraph":null,"raw_text":"第五條至第八條","to_article_id":32},{"relation":"處罰","target_law":null,"target_article":7,"target_sub":0,"target_paragraph":null,"raw_text":"第五條至第八條","to_article_id":33},{"relation":"處罰","target_law":null,"target_article":8,"target_sub":0,"target_paragraph":null,"raw_text":"第五條至第八條","to_article_id":34}]},{"id":40,"number":17,"sub":0,"label":"第 17 條","label_chinese":"第十七條","division_seq":2,"division_path":"第四章 損害賠償及罰則","is_deleted":false,"text":"公務機關違反第八條第一項規定者，除依前條規定處罰外，並應對其行為人依法懲處。","paragraphs":[{"index":1,"text":"公 何方式取得個人資料。\n三、處理：指為建立或利用個人資料檔案所為之紀錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送。\n四、當事人：指個人資料之本人。\n五、國際傳輸：指將個人資料作跨國（境）之處理或利用。","paragraphs":[{"index":1,"text":"本法用詞，定義如下：","items":[{"kind":"款","label":"一、","text":"個人資料：指自然人之姓名、出生年月日、聯絡方式及其他得以直接或間接識別該個人之資料。","children":[]},{"kind":"款","label":"二、","text":"蒐集：指以任何方式取得個人資料。","children":[]},{"kind":"款","label":"三、","text":"處理：指為建立或利用個人資料檔案所為之紀錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送。","children":[]},{"kind":"款","label":"四、","text":"當事人：指個人資料之本人。","children":[]},{"kind":"款","label":"五、","text":"國際傳輸：指將個人資料作跨國（境）之處理或利用。","children":[]}]}],"tags":[],"note":"","refs":[]},{"id":13,"number":3,"sub":0,"label":"第 3 條","label_chinese":"第三條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"本法之主管機關如下：\n一、在中央：為數位發展主管機關。\n二、在地方：\n（一）直轄市：為直轄市政府。\n（二）縣（市）：為縣（市）政府。\n第 二 章 蒐集、處理及利用","paragraphs":[{"index":1,"text":"本法之主管機關如下：","items":[{"kind":"款","label":"一、","text":"在中央：為數位發展主管機關。","children":[]},{"kind":"款","label":"二、","text":"在地方：","children":[{"kind":"目","label":"（一）","text":"直轄市：為直轄市政府。","children":[]},{"kind":"目","label":"（二）","text":"縣（市）：為縣（市）政府。","children":[]}]}]},{"index":2,"text":"第 二 章 蒐集、處理及利用","items":[]}],"tags":[],"note":"","refs":[]},{"id":14,"number":5,"sub":0,"label":"第 5 條","label_chinese":"第五條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。","paragraphs":[{"index":1,"text":"個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。","items":[]}],"tags":[],"note":"","refs":[]},{"id":15,"number":6,"sub":0,"label":"第 6 條","label_chinese":"第六條","division_seq":0,"division_path":"第一章 總則","is_deleted":false,"text":"蒐集個人資料，應向當事人告知下列事項：\n一、蒐集之目的。\n二、個人資料之類別。\n三、利用之期間、地區、對象及方式。\n四、當事人得行使之權利及方式。\n五、當事人得自由選擇提供個人資料時，不提供將對其權益之影響。","paragraphs":[{"index":1,"text":"蒐集個人資料，應向當事人告知下列事項：","items":[{"kind":"款","label":"一、","text":"蒐集之目的。","children":[]},{"kind":"款","label":"二、","text":"個人資料之類別。","children":[]},{"kind":"款","label":"三、" <script type="module">
/* 法規整理 App
 *
 * 資料來源有兩種，會自動切換：
 *   1. 本機伺服器 API（law serve）── 可讀寫，資料存在 D:\Vivian_Law\lawkit.db
 *   2. 離線資料包（IndexedDB 內的 bundle）── 沒有網路或伺服器沒開時，仍可瀏覽與檢索
 *
 * 離線時所做的標籤／筆記／收藏會排入待送佇列，連上伺服器後自動補送。
 */

const APP_VERSION = '0.1.0';

/* 單檔版（law standalone 產生的 HTML）會把資料直接嵌在頁面裡，
 * 此時沒有伺服器，所有讀取走內嵌資料，標註存在瀏覽器本機儲存空間。 */
const EMBEDDED_BUNDLE = typeof window !== 'undefined' ? window.__LAWKIT_BUNDLE__ : null;

// ------------------------------------------------------------------ 小工具
const $ = (selector, scope = document) => scope.querySelector(selector);

const escapeHtml = (value) =>
  String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));

const toast = (message, ms = 2200) => {
  const node = $('#toast');
  node.textContent = message;
  node.hidden = false;
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { node.hidden = true; }, ms);
};

const formatTimestamp = (value) => {
  if (!value) return '';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value).slice(0, 16).replace('T', ' ');
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
};

const settings = {
  data: { theme: 'auto', readingSize: 17, autoBundle: true },
  load() {
    try {
      Object.assign(this.data, JSON.parse(localStorage.getItem('lawkit.settings') || '{}'));
    } catch { /* 忽略毀損的設定 */ }
    return this.data;
  },
  save(changes) {
    Object.assign(this.data, changes);
    localStorage.setItem('lawkit.settings', JSON.stringify(this.data));
    applySettings();
  },
};

function applySettings() {
  const { theme, readingSize } = settings.data;
  const resolved = theme === 'auto'
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : theme;
  document.documentElement.dataset.theme = resolved;
  document.documentElement.style.setProperty('--reading-size', `${readingSize}px`);
}

const CHINESE_DIGITS = { 零: 0, 〇: 0, 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
const CHINESE_UNITS = { 十: 10, 百: 100, 千: 1000 };

function chineseToInt(text) {
  const raw = String(text).replace(/[\s\u3000]/g, '');
  if (/^\d+$/.test(raw)) return Number(raw);
  let total = 0;
  let digit = null;
  for (const ch of raw) {
    if (ch in CHINESE_DIGITS) digit = CHINESE_DIGITS[ch];
    else if (ch in CHINESE_UNITS) { total += (digit ?? 1) * CHINESE_UNITS[ch]; digit = null; }
    else if (/\d/.test(ch)) digit = Number(ch);
    else return NaN;
  }
  return total + (digit ?? 0);
}

// ------------------------------------------------------------------ IndexedDB
const db = {
  handle: null,
  async open() {
    if (this.handle) return this.handle;
    this.handle = await new Promise((resolve, reject) => {
      const request = indexedDB.open('lawkit', 1);
      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains('cache')) database.createObjectStore('cache');
        if (!database.objectStoreNames.contains('pending')) {
          database.createObjectStore('pending', { keyPath: 'id', autoIncrement: true });
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return this.handle;
  },
  async run(storeName, mode, action) {
    const database = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = database.transaction(storeName, mode);
      const request = action(transaction.objectStore(storeName));
      transaction.onerror = () => reject(transaction.error);
      if (request) request.onsuccess = () => resolve(request.result);
      else transaction.oncomplete = () => resolve();
    });
  },
  get(key) { return this.run('cache', 'readonly', (store) => store.get(key)); },
  put(key, value) { return this.run('cache', 'readwrite', (store) => store.put(value, key)); },
  queue(entry) { return this.run('pending', 'readwrite', (store) => store.add(entry)); },
  pending() { return this.run('pending', 'readonly', (store) => store.getAll()); },
  unqueue(id) { return this.run('pending', 'readwrite', (store) => store.delete(id)); },
};

// ------------------------------------------------------------------ 資料層
const state = {
  online: true,
  standalone: Boolean(EMBEDDED_BUNDLE),
  meta: null,
  bundle: null,
  bundleAt: null,
  laws: [],
  history: [],
};

class OfflineError extends Error {}

async function request(path, options = {}) {
  if (state.standalone) throw new OfflineError('單檔版沒有伺服器');
  if (navigator.onLine === false) {
    setOnline(false);
    throw new OfflineError('裝置目前離線');
  }
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch(path, {
      ...options,
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
    });
    // Service Worker 在離線時會回 503，屬於「連不上」而非伺服器錯誤
    if (response.status === 503) {
      setOnline(false);
      throw new OfflineError('目前無法連上伺服器');
    }
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || `伺服器回應 ${response.status}`);
    setOnline(true);
    return payload;
  } catch (error) {
    if (error.name === 'AbortError' || error instanceof TypeError) {
      setOnline(false);
      throw new OfflineError('目前無法連上伺服器');
    }
    throw error;
  } finally {
    clearTimeout(timer);
  }
}

function setOnline(online) {
  if (state.standalone || state.online === online) return;
  state.online = online;
  $('#offline-badge').hidden = online;
  if (online) flushPending();
}

/* 單檔版沒有伺服器可存，標註（標籤／筆記／收藏）改存在瀏覽器本機儲存空間。 */
const annotations = {
  key: 'lawkit.annotations',
  data: { tags: {}, notes: {}, bookmarks: [] },
  load() {
    try {
      Object.assign(this.data, JSON.parse(localStorage.getItem(this.key) || '{}'));
    } catch { /* 忽略毀損的資料 */ }
    return this.data;
  },
  save() {
    try {
      localStorage.setItem(this.key, JSON.stringify(this.data));
    } catch { /* 空間不足時僅保留在記憶體 */ }
  },
  apply(bundle) {
    this.load();
    for (const [id, tags] of Object.entries(this.data.tags)) {
      const article = bundle._articles.get(Number(id));
      if (article) article.tags = tags;
    }
    for (const [id, body] of Object.entries(this.data.notes)) {
      const article = bundle._articles.get(Number(id));
      if (article) article.note = body;
    }
    bundle.bookmarks = [...this.data.bookmarks];
    bundle.tags = [...new Set(Object.values(this.data.tags).flat())]
      .map((name) => ({ name, color: '', usage: 0 }));
    for (const tag of bundle.tags) {
      tag.usage = Object.values(this.data.tags).filter((names) => names.includes(tag.name)).length;
    }
  },
  record(bundle, articleId) {
    const article = bundle._articles.get(Number(articleId));
    if (!article) return;
    this.data.tags[articleId] = article.tags || [];
    if (article.note) this.data.notes[articleId] = article.note;
    else delete this.data.notes[articleId];
    this.data.bookmarks = [...(bundle.bookmarks || [])];
    this.save();
    this.apply(bundle);
  },
};

function bundleStats(bundle) {
  let articles = 0;
  let references = 0;
  let notes = 0;
  for (const law of bundle.laws || []) {
    articles += law.articles.length;
    for (const article of law.articles) {
      references += (article.refs || []).length;
      if (article.note) notes += 1;
    }
  }
  return {
    laws: (bundle.laws || []).length,
    articles,
    references,
    notes,
    tags: (bundle.tags || []).length,
    bookmarks: (bundle.bookmarks || []).length,
    schema_version: '單檔版',
  };
}

// ---- 離線資料包 -----------------------------------------------------------
async function loadBundleFromCache() {
  const cached = await db.get('bundle').catch(() => null);
  if (cached && cached.laws) {
    state.bundle = cached;
    state.bundleAt = cached.generated_at;
    indexBundle(cached);
  }
  return state.bundle;
}

async function refreshBundle({ silent = true } = {}) {
  let bundle = null;
  try {
    bundle = await request('/api/bundle');
  } catch {
    try {
      const response = await fetch('data/bundle.json', { cache: 'no-cache' });
      if (response.ok) bundle = await response.json();
    } catch { /* 純靜態部署時才會走到這裡 */ }
  }
  if (!bundle || !bundle.laws) {
    if (!silent) toast('無法取得離線資料');
    return null;
  }
  state.bundle = bundle;
  state.bundleAt = bundle.generated_at;
  indexBundle(bundle);
  await db.put('bundle', bundle).catch(() => {});
  if (!silent) toast(`離線資料已更新（${bundle.laws.length} 部法規）`);
  return bundle;
}

function indexBundle(bundle) {
  bundle._articles = new Map();
  bundle._incoming = new Map();
  for (const law of bundle.laws) {
    for (const article of law.articles) {
      article.law_id = law.id;
      article.law_name = law.name;
      bundle._articles.set(article.id, article);
    }
  }
  for (const law of bundle.laws) {
    for (const article of law.articles) {
      for (const ref of article.refs || []) {
        if (!ref.to_article_id) continue;
        const list = bundle._incoming.get(ref.to_article_id) || [];
        list.push({ ...ref, from_id: article.id, from_label: article.label, from_law_name: law.name });
        bundle._incoming.set(ref.to_article_id, list);
      }
    }
  }
}

function makeSnippet(text, term, width = 60) {
  const flat = text.replace(/\n/g, ' ');
  const position = flat.indexOf(term);
  if (position < 0) return flat.slice(0, width * 2);
  const start = Math.max(0, position - width / 2);
  const end = Math.min(flat.length, position + term.length + width);
  return `${start > 0 ? '…' : ''}${flat.slice(start, end)}${end < flat.length ? '…' : ''}`;
}

// ---- 統一的資料 API -----------------------------------------------------
const api = {
  async meta() {
    if (state.standalone) {
      state.meta = {
        app_title: '法規整理',
        paths: {
          '資料來源': '單檔版：法規資料已內嵌在這個 HTML 檔案中',
          '標註儲存': '瀏覽器本機儲存空間（清除瀏覽資料會一併清除）',
          '完整版': '安裝 Python 後執行 law serve，資料會存到 D:\\Vivian_Law',
        },
        stats: bundleStats(state.bundle || { laws: [] }),
        exporters: [],
      };
      return state.meta;
    }
    try {
      const meta = await request('/api/meta');
      state.meta = meta;
      await db.put('meta', meta).catch(() => {});
      return meta;
    } catch (error) {
      if (!(error instanceof OfflineError)) throw error;
      state.meta = (await db.get('meta').catch(() => null)) || null;
      return state.meta;
    }
  },

  async laws() {
    try {
      state.laws = await request('/api/laws');
      return state.laws;
    } catch (error) {
      if (!(error instanceof OfflineError)) throw error;
      const bundle = state.bundle || (await loadBundleFromCache()) || (await refreshBundle());
      state.laws = (bundle?.laws || []).map((law) => ({
        ...law,
        article_count: law.articles.length,
        imported_at: bundle.generated_at,
      }));
      return state.laws;
    }
  },

  async law(id) {
    try {
      return await request(`/api/laws/${id}`);
    } catch (error) {
      if (!(error instanceof OfflineError)) throw error;
      const bundle = state.bundle || (await loadBundleFromCache());
      const law = bundle?.laws.find((item) => String(item.id) === String(id));
      if (!law) throw new Error('離線資料中找不到這部法規');
      return { ...law, tree: buildOfflineTree(law), versions: [], stats: law.stats || {} };
    }
  },

  async article(id) {
    try {
      return await request(`/api/articles/${id}`);
    } catch (error) {
      if (!(error instanceof OfflineError)) throw error;
      const bundle = state.bundle || (await loadBundleFromCache());
      const article = bundle?._articles.get(Number(id));
      if (!article) throw new Error('離線資料中找不到這一條');
      return {
        ...article,
        note: article.note ? { body: article.note } : null,
        tags: (article.tags || []).map((name) => ({ name, color: '' })),
        bookmarked: (bundle.bookmarks || []).includes(article.id),
        outgoing: (article.refs || []).map((ref) => ({ ...ref, target_law_name: ref.target_law })),
        incoming: bundle._incoming.get(article.id) || [],
      };
    }
  },

  async search(query, { lawId = '', limit = 50 } = {}) {
    const params = new URLSearchParams({ q: query, limit: String(limit) });
    if (lawId) params.set('law', lawId);
    try {
      return await request(`/api/search?${params}`);
    } catch (error) {
      if (!(error instanceof OfflineError)) throw error;
      const bundle = state.bundle || (await loadBundleFromCache());
      const hits = [];
      for (const law of bundle?.laws || []) {
        if (lawId && String(law.id) !== String(lawId)) continue;
        for (const article of law.articles) {
          if (article.text.includes(query) || article.label.includes(query)) {
            hits.push({
              article_id: article.id,
              law_id: law.id,
              law_name: law.name,
              law_version: law.version_label || '',
              label: article.label,
              division_path: article.division_path,
              snippet: makeSnippet(article.text, query),
            });
            if (hits.length >= limit) break;
          }
        }
      }
      return { query, count: hits.length, hits };
    }
  },

  async history() {
    try { return await request('/api/history?limit=8'); } catch { return []; }
  },

  async tags() {
    try {
      return await request('/api/tags');
    } catch (error) {
      if (!(error instanceof OfflineError)) throw error;
      return (state.bundle?.tags || []).map((tag) => ({ ...tag }));
    }
  },

  async bookmarks() {
    try {
      return await request('/api/bookmarks');
    } catch (error) {
      if (!(error instanceof OfflineError)) return [];
      const bundle = state.bundle || (await loadBundleFromCache());
      return (bundle?.bookmarks || [])
        .map((id) => bundle._articles.get(Number(id)))
        .filter(Boolean)
        .map((article) => ({
          id: article.id,
          label: article.label,
          text: article.text,
          law_name: article.law_name,
        }));
    }
  },

  async notes() {
    try {
      return await request('/api/notes');
    } catch (error) {
      if (!(error instanceof OfflineError)) return [];
      const bundle = state.bundle || (await loadBundleFromCache());
      const rows = [];
      for (const article of bundle?._articles.values() || []) {
        if (article.note) {
          rows.push({
            article_id: article.id,
            label: article.label,
            law_name: article.law_name,
            body: article.note,
            updated_at: '',
          });
        }
      }
      return rows;
    }
  },

  async addTag(articleId, name) {
    return mutate(`/api/articles/${articleId}/tags`, 'POST', { name }, { type: 'addTag', articleId, name });
  },

  async removeTag(articleId, name) {
    return mutate(
      `/api/articles/${articleId}/tags/${encodeURIComponent(name)}`, 'DELETE', null,
      { type: 'removeTag', articleId, name },
    );
  },

  async setNote(articleId, body) {
    return mutate(`/api/articles/${articleId}/note`, 'PUT', { body }, { type: 'setNote', articleId, body });
  },

  async toggleBookmark(articleId) {
    return mutate(`/api/articles/${articleId}/bookmark`, 'POST', {}, { type: 'bookmark', articleId });
  },

  async importText(payload) {
    return request('/api/import', { method: 'POST', body: JSON.stringify(payload) });
  },

  async diff(fromId, toId) {
    try {
      return await request(`/api/diff?from=${fromId}&to=${toId}`);
    } catch (error) {
      if (!(error instanceof OfflineError)) throw error;
      const bundle = state.bundle || (await loadBundleFromCache());
      if (!bundle) throw new Error('沒有可比對的離線資料');
      return offlineDiff(bundle, fromId, toId);
    }
  },

  async exportAs(format, lawId = '') {
    const params = new URLSearchParams({ format });
    if (lawId) params.set('law', lawId);
    return request(`/api/export?${params}`);
  },
};

async function mutate(path, method, body, offlineEntry) {
  try {
    return await request(path, { method, body: body ? JSON.stringify(body) : undefined });
  } catch (error) {
    if (!(error instanceof OfflineError)) throw error;
    if (!state.standalone) {
      await db.queue({ ...offlineEntry, path, method, body, at: Date.now() }).catch(() => {});
      toast('已離線儲存，連線後自動同步');
    }
    applyOfflineMutation(offlineEntry);
    return { offline: true, bookmarked: state.bundle?.bookmarks?.includes(Number(offlineEntry.articleId)) };
  }
}

function applyOfflineMutation(entry) {
  const article = state.bundle?._articles.get(Number(entry.articleId));
  if (!article) return;
  if (entry.type === 'addTag') article.tags = [...new Set([...(article.tags || []), entry.name])];
  if (entry.type === 'removeTag') article.tags = (article.tags || []).filter((name) => name !== entry.name);
  if (entry.type === 'setNote') article.note = entry.body;
  if (entry.type === 'bookmark') {
    const marks = state.bundle.bookmarks || [];
    state.bundle.bookmarks = marks.includes(article.id)
      ? marks.filter((id) => id !== article.id)
      : [...marks, article.id];
  }
  if (state.standalone) {
    annotations.record(state.bundle, article.id);
    api.meta();
  } else {
    db.put('bundle', state.bundle).catch(() => {});
  }
}

async function flushPending() {
  const entries = await db.pending().catch(() => []);
  if (!entries.length) return;
  let sent = 0;
  for (const entry of entries) {
    try {
      await request(entry.path, {
        method: entry.method,
        body: entry.body ? JSON.stringify(entry.body) : undefined,
      });
      await db.unqueue(entry.id);
      sent += 1;
    } catch {
      return; // 仍然連不上，下次再試
    }
  }
  if (sent) toast(`已同步 ${sent} 筆離線變更`);
}

/* 以最長共同子序列做逐字比對，讓沒有伺服器時也能使用「修法比對」。 */
function diffSegments(oldText, newText) {
  const rows = oldText.length;
  const cols = newText.length;
  if (!rows) return newText ? [{ kind: 'insert', text: newText }] : [];
  if (!cols) return [{ kind: 'delete', text: oldText }];

  const table = Array.from({ length: rows + 1 }, () => new Uint32Array(cols + 1));
  for (let i = rows - 1; i >= 0; i -= 1) {
    for (let j = cols - 1; j >= 0; j -= 1) {
      table[i][j] = oldText[i] === newText[j]
        ? table[i + 1][j + 1] + 1
        : Math.max(table[i + 1][j], table[i][j + 1]);
    }
  }

  const segments = [];
  const push = (kind, text) => {
    if (!text) return;
    const last = segments[segments.length - 1];
    if (last && last.kind === kind) last.text += text;
    else segments.push({ kind, text });
  };

  let i = 0;
  let j = 0;
  while (i < rows && j < cols) {
    if (oldText[i] === newText[j]) { push('equal', oldText[i]); i += 1; j += 1; }
    else if (table[i + 1][j] >= table[i][j + 1]) { push('delete', oldText[i]); i += 1; }
    else { push('insert', newText[j]); j += 1; }
  }
  push('delete', oldText.slice(i));
  push('insert', newText.slice(j));
  return segments;
}

function offlineDiff(bundle, fromId, toId) {
  const oldLaw = bundle.laws.find((law) => String(law.id) === String(fromId));
  const newLaw = bundle.laws.find((law) => String(law.id) === String(toId));
  if (!oldLaw || !newLaw) throw new Error('找不到要比對的版本');

  const key = (article) => `${article.number}-${article.sub}`;
  const oldMap = new Map(oldLaw.articles.map((article) => [key(article), article]));
  const newMap = new Map(newLaw.articles.map((article) => [key(article), article]));
  const keys = [...new Set([...oldMap.keys(), ...newMap.keys()])]
    .sort((a, b) => {
      const [an, as] = a.split('-').map(Number);
      const [bn, bs] = b.split('-').map(Number);
      return (an * 1000 + as) - (bn * 1000 + bs);
    });

  const summary = { 新增: 0, 刪除: 0, 修正: 0, 未變動: 0 };
  const changes = [];
  for (const id of keys) {
    const before = oldMap.get(id);
    const after = newMap.get(id);
    const label = (after || before).label;
    if (!before) {
      summary.新增 += 1;
      changes.push({ label, status: '新增', similarity: 0, segments: [{ kind: 'insert', text: after.text }] });
    } else if (!after) {
      summary.刪除 += 1;
      changes.push({ label, status: '刪除', similarity: 0, segments: [{ kind: 'delete', text: before.text }] });
    } else if (before.text === after.text) {
      summary.未變動 += 1;
      changes.push({ label, status: '未變動', similarity: 1, segments: [] });
    } else {
      const segments = diffSegments(before.text, after.text);
      const same = segments.filter((s) => s.kind === 'equal').reduce((sum, s) => sum + s.text.length, 0);
      summary.修正 += 1;
      changes.push({
        label,
        status: '修正',
        similarity: (2 * same) / (before.text.length + after.text.length),
        segments,
      });
    }
  }
  return {
    law_name: newLaw.name,
    old_version: oldLaw.version_label || `#${oldLaw.id}`,
    new_version: newLaw.version_label || `#${newLaw.id}`,
    summary,
    changes,
  };
}

function buildOfflineTree(law) {
  const divisions = new Map(law.divisions.map((division) => [division.seq, { ...division, type: 'division', children: [] }]));
  const roots = [];
  for (const division of divisions.values()) {
    const parent = division.parent_seq != null ? divisions.get(division.parent_seq) : null;
    (parent ? parent.children : roots).push(division);
  }
  const loose = [];
  for (const article of law.articles) {
    const entry = {
      type: 'article',
      id: article.id,
      label: article.label,
      label_chinese: article.label_chinese,
      is_deleted: article.is_deleted,
      preview: article.text.split('\n')[0].slice(0, 60),
    };
    const owner = article.division_seq != null ? divisions.get(article.division_seq) : null;
    (owner ? owner.children : loose).push(entry);
  }
  return [...roots, ...loose];
}

const REFERENCE_PATTERN = /第\s*[0-9一二三四五六七八九十百千]+\s*條(?:\s*之\s*[0-9一二三四五六七八九十]+)?/g;

function linkifyReferences(text, refs, currentLawId) {
  const index = new Map();
  for (const ref of refs || []) {
    if (!ref.to_article_id) continue;
    index.set(`${ref.target_article}-${ref.target_sub || 0}`, ref.to_article_id);
  }
  return escapeHtml(text).replace(REFERENCE_PATTERN, (matched) => {
    const parts = matched.match(/第\s*([0-9一二三四五六七八九十百千]+)\s*條(?:\s*之\s*([0-9一二三四五六七八九十]+))?/);
    const number = chineseToInt(parts[1]);
    const sub = parts[2] ? chineseToInt(parts[2]) : 0;
    const target = index.get(`${number}-${sub}`);
    if (!target) return matched;
    return `<a class="ref-link" href="#/article/${target}">${matched}</a>`;
  });
}

function renderParagraphs(article) {
  const paragraphs = article.paragraphs || article.structure || [];
  if (!paragraphs.length) {
    return `<p class="paragraph">${linkifyReferences(article.text, article.outgoing)}</p>`;
  }
  const renderItems = (items) => items.map((item) => `
    <div class="item item--${item.kind}">
      <strong>${escapeHtml(item.label)}</strong>${linkifyReferences(item.text, article.outgoing)}
      ${item.children?.length ? `<div class="items">${renderItems(item.children)}</div>` : ''}
    </div>`).join('');

  const multiple = paragraphs.length > 1;
  return paragraphs.map((paragraph) => `
    <p class="paragraph">
      ${multiple ? `<span class="paragraph__index">${paragraph.index}</span>` : ''}
      ${linkifyReferences(paragraph.text, article.outgoing)}
    </p>
    ${paragraph.items?.length ? `<div class="items">${renderItems(paragraph.items)}</div>` : ''}
  `).join('');
}

function referenceRow(ref, direction) {
  if (direction === 'in') {
    return `
      <a class="reference" href="#/article/${ref.from_id}">
        <span class="reference__relation" data-relation="${escapeHtml(ref.relation)}">${escapeHtml(ref.relation)}</span>
        <span class="reference__text">${escapeHtml(ref.from_law_name)} ${escapeHtml(ref.from_label)}
          ${ref.context ? `<div class="reference__context">${escapeHtml(ref.context)}</div>` : ''}
        </span>
      </a>`;
  }
  const label = `${ref.target_law || '本法'} 第 ${ref.target_article}${ref.target_sub ? `-${ref.target_sub}` : ''} 條`;
  const inner = `
    <span class="reference__relation" data-relation="${escapeHtml(ref.relation)}">${escapeHtml(ref.relation)}</span>
    <span class="reference__text">${escapeHtml(label)}
      ${ref.raw_text ? `<div class="reference__context">${escapeHtml(ref.raw_text)}</div>` : ''}
    </span>`;
  return ref.to_article_id
    ? `<a class="reference" href="#/article/${ref.to_article_id}">${inner}</a>`
    : `<div class="reference">${inner}</div>`;
}

    <form class="searchbar" id="search-form">
      <input id="search-input" type="search" value="${escapeHtml(query)}" placeholder="輸入關鍵字，例如 損害賠償" enterkeyhint="search" />
      <button class="button" type="submit">搜尋</button>
    </form>
    <label class="field">
      <span>限定法規</span>
      <select id="search-law">
        <option value="">全部法規</option>
        ${laws.map((law) => `<option value="${law.id}" ${String(law.id) === lawId ? 'selected' : ''}>${escapeHtml(law.name)}</option>`).join('')}
      </select>
    </label>
    ${!query && history.length ? `
      <div class="section-title"><span>最近搜尋</span></div>
      <div class="tag-row">
        ${history.map((row) => `<a class="chip" href="#/search?q=${encodeURIComponent(row.query)}">${escapeHtml(row.query)}</a>`).join('')}
      </div>` : ''}
    <div id="search-results"></div>
  `);

  $('#search-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const keyword = $('#search-input').value.trim();
    const law = $('#search-law').value;
    location.hash = `#/search?q=${encodeURIComponent(keyword)}${law ? `&law=${law}` : ''}`;
  });

  if (!query) return;
  const target = $('#search-results');
  target.innerHTML = '<div class="loading">搜尋中…</div>';
  const result = await api.search(query, { lawId });
  const highlight = (text) => escapeHtml(text)
    .replaceAll('【', '<mark>').replaceAll('】', '</mark>')
    .replaceAll(escapeHtml(query), `<mark>${escapeHtml(query)}</mark>`);

  const fuzzy = result.hits.length > 0 && result.hits[0].fuzzy;
  target.innerHTML = `
    <div class="section-title"><span>結果</span><span>${result.count} 筆</span></div>
    ${fuzzy ? `<div class="card"><p class="hit__snippet">找不到完全相符的「${escapeHtml(query)}」，
      以下是字序寬鬆比對的結果（中間允許夾雜其他文字）。</p></div>` : ''}
    ${result.count ? `<div class="list">${result.hits.map((hit) => `
      <a class="card card--tap" href="#/article/${hit.article_id}">
        <div class="hit__head">
          <span class="hit__law">${escapeHtml(hit.law_name)}
            ${hit.law_version ? `<span class="hit__version">${escapeHtml(hit.law_version)}</span>` : ''}
          </span>
          <span class="hit__label">${escapeHtml(hit.label)}</span>
        </div>
        ${hit.division_path ? `<p class="hit__path">${escapeHtml(hit.division_path)}</p>` : ''}
        <p class="hit__snippet">${highlight(hit.snippet)}</p>
      </a>`).join('')}</div>`
      : '<div class="empty">沒有符合的條文。試試更短的關鍵字。</div>'}
  `;
}

async function viewTag(name) {
  setHeader(`標籤：${name}`, '', { back: true });
  setActiveTab('organize');
  loading();
  let rows = [];
  try {
    rows = await request(`/api/tags/${encodeURIComponent(name)}`);
  } catch {
    rows = [];
    for (const law of state.bundle?.laws || []) {
      for (const article of law.articles) {
        if ((article.tags || []).includes(name)) {
          rows.push({ id: article.id, label: article.label, text: article.text, law_name: law.name });
        }
      }
    }
  }
  render(rows.length ? `<div class="list">${rows.map((row) => `
    <a class="card card--tap" href="#/article/${row.id}">
      <div class="hit__head"><span class="hit__law">${escapeHtml(row.law_name)}</span><span class="hit__label">${escapeHtml(row.label)}</span></div>
      <p class="hit__snippet">${escapeHtml(row.text.split('\n')[0].slice(0, 80))}</p>
    </a>`).join('')}</div>` : '<div class="empty">這個標籤還沒有條文。</div>');
}

// ---- 比對 ---------------------------------------------------------------
async function viewDiff(params) {
  setHeader('修法比對', '比較同一部法規的兩個版本');
  setActiveTab('diff');
  loading();
  const laws = await api.laws();
  const grouped = new Map();
  for (const law of laws) {
    grouped.set(law.name, [...(grouped.get(law.name) || []), law]);
  }
  const comparable = [...grouped.entries()].filter(([, items]) => items.length > 1);
  const selectedName = params.get('law') || comparable[0]?.[0] || '';
  const versions = grouped.get(selectedName) || [];

  render(`
    <div class="card">
      ${comparable.length ? `
        <label class="field"><span>法規</span>
          <select id="diff-law">
            ${comparable.map(([name]) => `<option ${name === selectedName ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}
          </select>
        </label>
        <label class="field"><span>舊版</span>
          <select id="diff-from">${versions.map((law, index) => `<option value="${law.id}" ${index === 0 ? 'selected' : ''}>${escapeHtml(law.version_label || `#${law.id}`)}</option>`).join('')}</select>
        </label>
        <label class="field"><span>新版</span>
          <select id="diff-to">${versions.map((law, index) => `<option value="${law.id}" ${index === versions.length - 1 ? 'selected' : ''}>${escapeHtml(law.version_label || `#${law.id}`)}</option>`).join('')}</select>
        </label>
        <button class="button button--block" data-action="run-diff">開始比對</button>`
        : `<p>要比對修法前後，需要同一部法規的兩個版本。</p>
           <p class="hit__snippet">匯入時用 <code>--version</code> 標示版本，例如：<br>
           <code>law import 民法-110.txt --version 110.01.13</code><br>
           <code>law import 民法-112.txt --version 112.06.21</code></p>`}
    </div>
    <div id="diff-result"></div>
  `);

  $('#diff-law')?.addEventListener('change', (event) => {
    location.hash = `#/diff?law=${encodeURIComponent(event.target.value)}`;
  });

  $('[data-action="run-diff"]')?.addEventListener('click', async () => {
    const fromId = $('#diff-from').value;
    const toId = $('#diff-to').value;
    if (fromId === toId) return toast('請選擇兩個不同的版本');
    const target = $('#diff-result');
    target.innerHTML = '<div class="loading">比對中…</div>';
    try {
      const result = await api.diff(fromId, toId);
      const changes = result.changes.filter((change) => change.status !== '未變動');
      target.innerHTML = `
        <div class="section-title"><span>結果</span><span>${result.old_version} → ${result.new_version}</span></div>
        <div class="diff-summary">
          ${Object.entries(result.summary).filter(([, count]) => count).map(([status, count]) =>
            `<span class="chip ${status === '刪除' ? 'chip--del' : status === '新增' ? 'chip--accent' : ''}">${status} ${count}</span>`).join('')}
        </div>
        ${changes.length ? changes.map((change) => `
          <div class="card diff-change">
            <div class="diff-change__head">
              <span class="hit__label">${escapeHtml(change.label)}</span>
              <span class="chip ${change.status === '刪除' ? 'chip--del' : 'chip--accent'}">${change.status}</span>
              ${change.status === '修正' ? `<span class="chip chip--muted">相似度 ${Math.round(change.similarity * 100)}%</span>` : ''}
            </div>
            <div class="diff-body">${(change.segments || []).map((segment) => {
              const text = escapeHtml(segment.text);
              if (segment.kind === 'insert') return `<span class="diff-ins">${text}</span>`;
              if (segment.kind === 'delete') return `<span class="diff-del">${text}</span>`;
              return text;
            }).join('')}</div>
          </div>`).join('')
          : '<div class="empty">兩個版本沒有差異。</div>'}
      `;
    } catch (error) {
      target.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
    }
    return undefined;
  });
}

// ---- 匯入 ---------------------------------------------------------------
function viewImport() {
  setHeader('匯入法規', '貼上條文，自動解析結構', { back: true });
  setActiveTab('home');

  if (state.standalone) {
    render(`
      <div class="card">
        <p>這是<b>單檔試用版</b>，法規資料已內嵌在檔案裡，無法在此匯入新法規。</p>
        <p class="hit__snippet">要匯入自己的法規，請使用完整版：安裝 Python 後執行
        <code>law import 法規.txt</code>，再用 <code>law serve</code> 啟動 App；
        也可以用 <code>law standalone</code> 把自己的知識庫重新產生成一個單檔 App。</p>
      </div>
      <div class="card">
        <p class="hit__snippet">試用版仍可完整體驗：瀏覽章節、閱讀條文、點擊條號跳轉、
        全文檢索、加標籤與筆記、收藏，以及修法比對。標註會存在這台裝置的瀏覽器裡。</p>
      </div>
    `);
    return;
  }

  render(`
    <div class="card">
      <label class="field"><span>法規名稱（可留空，自動判斷）</span>
        <input type="text" id="import-name" placeholder="例如：中華民國民法" /></label>
      <label class="field"><span>版本標籤（可留空）</span>
        <input type="text" id="import-version" placeholder="例如：110.01.13" /></label>
      <label class="field"><span>條文內容</span>
        <textarea id="import-text" style="min-height:220px" placeholder="第 1 條&#10;民事，法律所未規定者，依習慣；無習慣者，依法理。&#10;第 2 條&#10;……"></textarea></label>
      <button class="button button--block" data-action="do-import">解析並匯入</button>
      <p class="hit__snippet" style="margin-top:12px">
        支援全國法規資料庫的純文字格式，會自動辨識編章節、條、項、款、目與交互參照。
        大量檔案建議在電腦上執行 <code>law import 資料夾</code>。
      </p>
    </div>
  `);

  $('[data-action="do-import"]').addEventListener('click', async (event) => {
    const text = $('#import-text').value;
    if (!text.trim()) return toast('請先貼上條文');
    event.target.disabled = true;
    event.target.textContent = '匯入中…';
    try {
      const result = await api.importText({
        text,
        name: $('#import-name').value.trim(),
        version: $('#import-version').value.trim(),
        replace: true,
      });
      toast(`已匯入 ${result.name}，共 ${result.stats.articles} 條`);
      await refreshBundle();
      location.hash = `#/law/${result.law_id}`;
    } catch (error) {
      toast(error instanceof OfflineError ? '匯入需要連上伺服器' : error.message);
      event.target.disabled = false;
      event.target.textContent = '解析並匯入';
    }
    return undefined;
  });
}

async function viewSettings() {
  setHeader('設定', 'App 與資料位置');
  setActiveTab('settings');
  loading();
  const meta = state.meta || (await api.meta());
  const paths = meta?.paths || {};

  render(`
    <div class="section-title"><span>知識庫位置</span></div>
    <div class="card">
      <table class="path-table">
        ${Object.entries(paths).map(([key, value]) =>
          `<tr><th>${escapeHtml(key)}</th><td>${escapeHtml(String(value))}</td></tr>`).join('')}
      </table>
    </div>

    <div class="section-title"><span>離線資料</span></div>
    <div class="card">
      <p class="hit__snippet">
        ${state.bundleAt ? `目前離線資料產生於 ${escapeHtml(formatTimestamp(state.bundleAt))}` : '尚未下載離線資料。'}
      </p>
      <div class="button-row" style="margin-top:10px">
        <button class="button button--small" data-action="sync-bundle">更新離線資料</button>
        <button class="button button--small button--ghost" data-action="flush">補送離線變更</button>
      </div>
    </div>

    <div class="section-title"><span>閱讀</span></div>
    <div class="card">
      <label class="field"><span>字體大小：<b id="size-value">${settings.data.readingSize}</b> px</span>
        <input type="range" id="size-range" min="14" max="24" value="${settings.data.readingSize}" style="width:100%" /></label>
      <label class="field"><span>外觀</span>
        <select id="theme-select">
          ${['auto', 'light', 'dark'].map((value) => `<option value="${value}" ${settings.data.theme === value ? 'selected' : ''}>
            ${{ auto: '跟隨系統', light: '淺色', dark: '深色' }[value]}</option>`).join('')}
        </select></label>
    </div>

    <div class="section-title"><span>匯出</span></div>
    <div class="card">
      <div class="button-row">
        ${(meta?.exporters || []).map((item) => `
          <button class="button button--small button--ghost" data-export="${item.name}" title="${escapeHtml(item.description)}">
            ${escapeHtml(item.name)}
          </button>`).join('') || '<span class="hit__snippet">需連上伺服器才能匯出。</span>'}
      </div>
      <p class="hit__snippet" style="margin-top:10px">匯出檔案會下載到手機／電腦，也可在電腦上執行 <code>law export markdown</code>。</p>
    </div>

    <div class="section-title"><span>關於</span></div>
    <div class="card">
      <p class="hit__snippet">法規整理 App v${APP_VERSION}　資料庫結構 v${meta?.stats?.schema_version ?? '-'}</p>
      <p class="hit__snippet">在手機瀏覽器選擇「加入主畫面」即可像 App 一樣使用，離線也能查閱。</p>
    </div>
  `);

  $('#size-range').addEventListener('input', (event) => {
    $('#size-value').textContent = event.target.value;
    settings.save({ readingSize: Number(event.target.value) });
  });
  $('#theme-select').addEventListener('change', (event) => settings.save({ theme: event.target.value }));
  $('[data-action="sync-bundle"]').addEventListener('click', () => refreshBundle({ silent: false }));
  $('[data-action="flush"]').addEventListener('click', flushPending);

  for (const button of document.querySelectorAll('[data-export]')) {
    button.addEventListener('click', async () => {
      try {
        const result = await api.exportAs(button.dataset.export);
        const blob = new Blob([result.content], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `lawkit-${button.dataset.export}.txt`;
        link.click();
        URL.revokeObjectURL(link.href);
      } catch (error) {
        toast(error.message);
      }
    });
  }
}

// ------------------------------------------------------------------ 路由
const routes = [
  [/^\/?$/, () => viewHome()],
  [/^\/law\/(\d+)$/, (match) => viewLaw(match[1])],
  [/^\/article\/(\d+)$/, (match) => viewArticle(match[1])],
  [/^\/search$/, (match, params) => viewSearch(params)],
  [/^\/organize$/, () => viewOrganize()],
  [/^\/tag\/(.+)$/, (match) => viewTag(decodeURIComponent(match[1]))],
  [/^\/diff$/, (match, params) => viewDiff(params)],
  [/^\/import$/, () => viewImport()],
  [/^\/settings$/, () => viewSettings()],
];

async function routeTo() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, queryString = ''] = raw.split('?');
  const params = new URLSearchParams(queryString);
  for (const [pattern, handler] of routes) {
    const match = path.match(pattern);
    if (!match) continue;
    try {
      await handler(match, params);
    } catch (error) {
      render(`<div class="empty">${escapeHtml(error.message || '發生錯誤')}</div>`);
    }
    return;
  }
  render('<div class="empty">找不到這個畫面。</div>');
}

// ------------------------------------------------------------------ 啟動
async function boot() {
  settings.load();
  applySettings();

  $('#back-button').addEventListener('click', () => history.back());
  $('#theme-button').addEventListener('click', () => {
    const order = ['auto', 'light', 'dark'];
    const next = order[(order.indexOf(settings.data.theme) + 1) % order.length];
    settings.save({ theme: next });
    toast({ auto: '跟隨系統', light: '淺色模式', dark: '深色模式' }[next]);
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings);
  window.addEventListener('hashchange', routeTo);
  window.addEventListener('online', () => { setOnline(true); routeTo(); });
  window.addEventListener('offline', () => setOnline(false));

  if (state.standalone) {
    state.bundle = EMBEDDED_BUNDLE;
    state.bundleAt = EMBEDDED_BUNDLE.generated_at;
    indexBundle(state.bundle);
    annotations.apply(state.bundle);
    const badge = $('#offline-badge');
    badge.textContent = '單檔版';
    badge.hidden = false;
  } else {
    await loadBundleFromCache().catch(() => null);
  }

  await api.meta().catch(() => null);
  await routeTo();

  if (!state.standalone && settings.data.autoBundle && state.online) {
    refreshBundle().catch(() => {});
    flushPending().catch(() => {});
  }

  // file:// 無法註冊 Service Worker，單檔版本身就已離線可用
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

boot();
