<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Law Organizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4d78"/>
      <stop offset="1" stop-color="#152840"/>
    </linearGradient>
    <!-- userSpaceOnUse???? bounding box ????????????????? -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="256" y1="130" x2="256" y2="370">
      <stop offset="0" stop-color="#f2dcae"/>
      <stop offset="1" stop-color="#c28f4c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- statute page behind the scale -->
  <rect x="150" y="88" width="212" height="344" rx="20" fill="#f4f1ea" opacity=".14"/>
  <g fill="#f4f1ea" opacity=".45">
    <rect x="182" y="384" width="148" height="12" rx="6"/>
    <rect x="203" y="410" width="106" height="12" rx="6"/>
  </g>

  <!-- balance scale -->
  <g stroke="url(#gold)" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M256 150v186"/>
    <path d="M132 178h248"/>
    <path d="M132 178v56"/>
    <path d="M380 178v56"/>
    <path d="M204 356h104"/>
    <path d="M92 234a40 40 0 0 0 80 0"/>
    <path d="M340 234a40 40 0 0 0 80 0"/>
  </g>
  <circle cx="256" cy="150" r="20" fill="url(#gold)"/>
</svg>
