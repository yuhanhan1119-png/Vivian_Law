<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f3a5f" />
<meta name="description" content="法規整理 App：條文結構化、全文檢索、交互參照、標籤筆記與修法比對。" />
<title>法規整理</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

<meta name="apple-mobile-web-app-capable" content="yes" />

<body>
<div id="app">
  <header class="topbar">

  <main id="view" class="view" tabindex="-1">

  <nav class="tabbar" id="tabbar">
    <a class="tabbar__item" href="#/" data-tab="home"><span class="tabbar__icon">📚</span><span>法規</span></a>

    <a class="tabbar__item" href="#/settings" data-tab="settings"><span class="tabbar__icon">⚙️</span><span>設定</span></a>
